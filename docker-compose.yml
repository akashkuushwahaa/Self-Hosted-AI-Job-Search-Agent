services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shortlist
      POSTGRES_PASSWORD: shortlist
      POSTGRES_DB: shortlist
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shortlist"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
